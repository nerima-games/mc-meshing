allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  # Kernel 0.9.0 was published immediately before this downstream follow-up; exclude it so the pinned install remains reproducible during the migration.
  - '@nerima-games/mc-kernel@0.4.0 || 0.7.0 || 0.8.0 || 0.9.0 || 0.14.0'
overrides:
  # GHSA-2v37-7h3g-55p8: nanoid's custom generator loops indefinitely when
  # size is 0. Transitive via vitest/@vitest/coverage-v8 -> vite -> postcss ->
  # nanoid; pinned here rather than waiting on the upstream chain to bump it,
  # per plan.md §4 step 14 ("pin the transitive package in pnpm-workspace.yaml
  # overrides as the kernel does").
  nanoid: '>=3.3.18'
  # pnpm audit: GHSA-68fv-2mgg-jv7q
  source-map-js: 1.2.2
  # pnpm audit: GHSA-698v-4r3x-3vcv, GHSA-r825-w8mm-5pxw, GHSA-587h-7wmj-h5pm,
  # GHSA-9jrq-w75r-8gcw, GHSA-rq7h-c2jc-7f22
  vite: 7.3.7
  # pnpm audit: GHSA-qxg6-89mg-rqv8, GHSA-xp26-3454-mjgp
  '@vitest/mocker': 4.1.12
  # pnpm audit: GHSA-698v-4r3x-3vcv, GHSA-r825-w8mm-5pxw, GHSA-587h-7wmj-h5pm
  launch-editor: 2.14.2
  # pnpm audit: GHSA-pqg4-j6r4-53mv
  shell-quote: 1.11.0
