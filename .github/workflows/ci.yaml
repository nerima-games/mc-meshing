name: CI

on:
  push:
    branches: [main]
  pull_request:

# These are public repositories, so a fork PR runs this workflow. Nothing here
# needs write access, and an unset block inherits an org default that is not
# managed in Terraform.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # Full history: `pnpm changeset status --since=origin/main` (below)
          # needs to diff against the merge base, which a shallow (depth-1)
          # checkout cannot resolve.
          fetch-depth: 0

      - name: Setup pnpm
        # Pinned to a commit, not the mutable v4 tag: this is a third-party action
        # and a tag can be repointed at new code without any change here.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        # --ignore-scripts: pnpm runs postinstall, and a fork PR can edit
        # package.json and the lockfile consistently and still satisfy
        # --frozen-lockfile. Nothing here needs a lifecycle script.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify (typecheck && lint && test)
        run: pnpm verify

      # RELEASE_STANDARD.md §1.2: every user-facing PR must add a changeset.
      # Only meaningful for PRs (a push to main has nothing left to diff
      # against itself).
      - name: Changeset status
        if: github.event_name == 'pull_request'
        run: pnpm changeset status --since=origin/main

      # Coverage gate (TEST_STANDARD.md §3): statements/branches/functions/lines
      # all thresholded at 99% in vitest.config.ts. Run as its own required CI
      # step, separate from `pnpm verify`, so the report-generation overhead
      # doesn't slow down the fast verify loop.
      - name: Coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 7
